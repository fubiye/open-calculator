[workspace]
resolver = "2"
members = ["crates/server"]
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Fu, Biye"]
repository = "https://github.com/fubiye/open-calculator"

[workspace.dependencies]
axum = "0.8.9"
tokio = { version = "1.54", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"

# 本地服务/桌面 sidecar 对启动时间与体积敏感：开启 LTO、单 codegen unit、剥离符号。
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
